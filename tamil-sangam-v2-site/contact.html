<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact | Macclesfield Tamil Sangam</title>
<meta name="description" content="Macclesfield Tamil Sangam – bringing the Tamil community of Macclesfield and Cheshire together through culture, language, festivals and friendship.">
<link rel="icon" href="/assets/img/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="/assets/img/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Tamil:wght@500;700&family=Noto+Sans+Tamil:wght@400;500;600&family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-title="contact">
<div id="site-header"></div>
<main>
<section class="page-head" id="pageHead" style="--bg:url('/assets/img/photos/temple-gateway-hd.jpg')">
  <div class="wrap"><h1 data-t="contactTitle"></h1><p data-t="contactLead"></p></div>
</section>
<section>
  <div class="wrap">
    <div class="contact-grid" id="contactGrid">
      <div class="cards" id="cards"></div>
      <form class="box" name="contact" method="POST" data-netlify="true" netlify-honeypot="bot-field" id="contactForm">
        <input type="hidden" name="form-name" value="contact">
        <p class="hidden"><label>Leave this empty <input name="bot-field"></label></p>
        <h3 data-t="formTitle"></h3>
        <div class="row">
          <div><label for="fn" data-t="fName"></label><input id="fn" name="name" required autocomplete="name"></div>
          <div><label for="fp" data-t="fPhone"></label><input id="fp" name="phone" type="tel" autocomplete="tel"></div>
        </div>
        <label for="fe" data-t="fEmail"></label><input id="fe" name="email" type="email" required autocomplete="email">
        <label for="fs" data-t="fSubject"></label><select id="fs" name="subject"></select>
        <label for="fm" data-t="fMessage"></label><textarea id="fm" name="message" required></textarea>
        <button class="btn" type="submit" id="fsend" data-t="fSend"></button>
        <div class="form-msg hidden" id="fmsg" role="status"></div>
      </form>
    </div>
  </div>
</section>
</main>
<div id="site-footer"></div>
<script src="assets/js/config.js"></script>
<script src="assets/js/i18n.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/core.js"></script>
<script src="assets/js/pages/contact.js"></script>
</body>
</html>
