<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>About Us | Macclesfield Tamil Sangam</title>
<meta name="description" content="Macclesfield Tamil Sangam – bringing the Tamil community of Macclesfield and Cheshire together through culture, language, festivals and friendship.">
<link rel="icon" href="/assets/img/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="/assets/img/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Tamil:wght@500;700&family=Noto+Sans+Tamil:wght@400;500;600&family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-title="about">
<div id="site-header"></div>
<main>
<section class="page-head" id="pageHead" style="--bg:url('/assets/img/photos/temple-courtyard-hd.jpg')">
  <div class="wrap"><h1 data-t="about"></h1><p data-t="aboutTitle"></p></div>
</section>
<section>
  <div class="wrap about-grid" style="align-items:start">
    <div>
      <h2 class="sec-title" data-t="aboutTitle"></h2>
      <p class="lead" data-t="aboutP1"></p>
      <p class="lead" style="margin-top:12px" data-t="aboutP2"></p>
      <div class="quote">
        <div class="tamil">யாதும் ஊரே யாவரும் கேளிர்</div>
        <small data-t="quoteMeaning"></small>
      </div>
    </div>
    <div>
      <img src="assets/img/photos/temple-inscription-wall.jpg" alt="Tamil inscriptions (kalvettu) on the Thanjavur Big Temple" style="border-radius:14px;width:100%;aspect-ratio:4/3;object-fit:cover;margin-bottom:26px">
      <h3 class="sec-title" style="font-size:1.6rem" data-t="missionTitle"></h3>
      <p class="lead" style="margin-bottom:18px" data-t="missionLead"></p>
      <div class="pillars">
        <div class="pillar"><div class="ic">🪔</div><h3 data-t="p1t"></h3><p data-t="p1d"></p></div>
        <div class="pillar"><div class="ic">📚</div><h3 data-t="p2t"></h3><p data-t="p2d"></p></div>
        <div class="pillar"><div class="ic">💃</div><h3 data-t="p3t"></h3><p data-t="p3d"></p></div>
        <div class="pillar"><div class="ic">🤝</div><h3 data-t="p4t"></h3><p data-t="p4d"></p></div>
      </div>
    </div>
  </div>
  <div class="wrap">
    <div class="stats">
      <div class="stat"><b id="statEvents">–</b><span data-t="statEvents"></span></div>
      <div class="stat"><b id="statYears">–</b><span data-t="statYears"></span></div>
      <div class="stat"><b>100%</b><span data-t="statVol"></span></div>
    </div>
    <div class="kalvettu">
      <img src="assets/img/photos/temple-inscription-closeup.jpg" alt="Tamil inscription (kalvettu) close-up" loading="lazy">
      <div><span class="eyebrow">கல்வெட்டு · Kalvettu</span><h2 class="sec-title" data-t="kalvettuTitle"></h2><p class="lead" data-t="kalvettuCaption"></p></div>
      <img src="assets/img/photos/temple-inscription-pillar.jpg" alt="Inscribed stone pillar with a shrine behind" loading="lazy">
    </div>
    <p class="center" style="margin-top:40px"><a class="btn" href="join.html" data-t="joinNow"></a> <a class="btn outline" href="contact.html" data-t="joinUs" style="margin-left:8px"></a></p>
  </div>
</section>
</main>
<div id="site-footer"></div>
<script src="assets/js/config.js"></script>
<script src="assets/js/i18n.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/core.js"></script>
<script src="assets/js/pages/about.js"></script>
</body>
</html>
