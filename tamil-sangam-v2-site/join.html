<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Join | Macclesfield Tamil Sangam</title>
<meta name="description" content="Macclesfield Tamil Sangam – bringing the Tamil community of Macclesfield and Cheshire together through culture, language, festivals and friendship.">
<link rel="icon" href="/assets/img/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="/assets/img/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Tamil:wght@500;700&family=Noto+Sans+Tamil:wght@400;500;600&family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-title="joinTitle">
<div id="site-header"></div>
<main>
<section class="page-head" id="pageHead" style="--bg:url('/assets/img/photos/temple-tower-dusk-hd.jpg')">
  <div class="wrap"><h1 data-t="joinTitle"></h1><p data-t="joinLead"></p></div>
</section>
<section>
  <div class="wrap contact-grid">
    <div>
      <h2 class="sec-title" style="font-size:1.7rem" data-t="whyJoin"></h2>
      <ul class="ticks">
        <li data-t="why1"></li><li data-t="why2"></li><li data-t="why3"></li><li data-t="why4"></li>
      </ul>
      <p class="note" data-t="joinNote"></p>
    </div>
    <form class="box" id="joinForm" novalidate>
      <h3 data-t="createAccount"></h3>
      <label for="jn" data-t="fullName"></label><input id="jn" required autocomplete="name">
      <div class="row">
        <div><label for="je" data-t="fEmail"></label><input id="je" type="email" required autocomplete="email"></div>
        <div><label for="jp" data-t="fPhone"></label><input id="jp" type="tel" autocomplete="tel"></div>
      </div>
      <label for="jw"><span data-t="password"></span> <small style="color:var(--muted)">(<span data-t="passwordHint"></span>)</small></label>
      <input id="jw" type="password" required minlength="8" autocomplete="new-password">
      <label class="check"><input type="checkbox" id="jc" required> <span data-t="agreePrivacy"></span></label>
      <button class="btn" type="submit" id="jbtn" data-t="createAccount"></button>
      <div class="form-msg hidden" id="jmsg" role="status"></div>
      <p style="margin-top:16px;font-size:.92rem"><span data-t="haveAccount"></span> <a class="link" href="login.html" data-t="logIn"></a></p>
    </form>
  </div>
</section>
</main>
<div id="site-footer"></div>
<script src="assets/js/config.js"></script>
<script src="assets/js/i18n.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/core.js"></script>
<script src="assets/js/pages/join.js"></script>
</body>
</html>
