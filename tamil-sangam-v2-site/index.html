<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Macclesfield Tamil Sangam</title>
<meta name="description" content="Macclesfield Tamil Sangam – bringing the Tamil community of Macclesfield and Cheshire together through culture, language, festivals and friendship.">
<link rel="icon" href="/assets/img/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="/assets/img/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Tamil:wght@500;700&family=Noto+Sans+Tamil:wght@400;500;600&family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-title="">
<div id="site-header"></div>
<main>
<section class="hero" style="padding:0" aria-roledescription="carousel">
  <div id="slides"></div>
  <button class="arrow prev" aria-label="Previous slide">‹</button>
  <button class="arrow next" aria-label="Next slide">›</button>
  <div class="dots" id="dots"></div>
</section>

<section>
  <div class="wrap">
    <div class="sec-head">
      <div><span class="eyebrow" data-t="events"></span><h2 class="sec-title" data-t="upcomingTitle"></h2><p class="lead" data-t="upcomingLead"></p></div>
      <a class="link" href="events.html" data-t="viewAll"></a>
    </div>
    <div class="ev-grid" id="upcoming"></div>
  </div>
</section>

<section class="alt">
  <div class="wrap about-grid">
    <div>
      <span class="eyebrow" data-t="about"></span>
      <h2 class="sec-title" data-t="aboutTitle"></h2>
      <p class="lead" data-t="aboutP1"></p>
      <p style="margin-top:22px"><a class="btn outline" href="about.html" data-t="readMore"></a></p>
    </div>
    <div class="pillars">
      <div class="pillar"><div class="ic">🪔</div><h3 data-t="p1t"></h3><p data-t="p1d"></p></div>
      <div class="pillar"><div class="ic">📚</div><h3 data-t="p2t"></h3><p data-t="p2d"></p></div>
      <div class="pillar"><div class="ic">💃</div><h3 data-t="p3t"></h3><p data-t="p3d"></p></div>
      <div class="pillar"><div class="ic">🤝</div><h3 data-t="p4t"></h3><p data-t="p4d"></p></div>
    </div>
  </div>
</section>

<section>
  <div class="wrap">
    <div class="sec-head">
      <div><span class="eyebrow" data-t="pastEvents"></span><h2 class="sec-title" data-t="pastTitle"></h2></div>
      <a class="link" href="past-events.html" data-t="viewAll"></a>
    </div>
    <div class="ev-grid" id="recent"></div>
  </div>
</section>

<section class="join-band">
  <div class="wrap">
    <div><h2 data-t="joinTitle"></h2><p data-t="joinLead"></p></div>
    <a class="btn" href="join.html" data-t="join"></a>
  </div>
</section>
</main>
<div id="site-footer"></div>
<script src="assets/js/config.js"></script>
<script src="assets/js/i18n.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/core.js"></script>
<script src="assets/js/pages/home.js"></script>
</body>
</html>
